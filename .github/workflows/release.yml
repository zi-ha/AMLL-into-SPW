name: 构建并发布

# 手动触发：读取 gradle.properties 中的版本号，构建 .spmod，并创建/更新对应的 GitHub Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（留空则使用 v<gradle.properties 版本号>）"
        required: false
        default: ""
      draft:
        description: "保存为草稿（仅新建 Release 时生效）"
        type: boolean
        default: false
      prerelease:
        description: "标记为预发布（仅新建 Release 时生效）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建插件
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 读取版本号
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties | head -n1 | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::gradle.properties 中未找到 version="
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)*([-+.][0-9A-Za-z.+-]+)?$'; then
            echo "::error::版本号格式无法用于发布标签：$version"
            exit 1
          fi

          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag="v${version}"
          fi
          case "$tag" in
            -*|*' '*)
              echo "::error::发布标签不合法：$tag"
              exit 1
              ;;
          esac
          if [ "$tag" != "v${version}" ]; then
            echo "::warning::标签 $tag 与版本号 $version 不一致，发布内容仍以构建产物为准"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### 读取版本"
            echo ""
            echo "- 版本号：\`$version\`"
            echo "- 发布标签：\`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 安装 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 仓库中 gradlew 未记录可执行位（Windows 提交），显式补齐。
      - name: 构建 .spmod
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace clean plugin

      - name: 校验产物
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          asset="build/libs/amll-into-spw-misans-${VERSION}.spmod"
          if [ ! -f "$asset" ]; then
            echo "::error::未找到构建产物 $asset"
            ls -l build/libs || true
            exit 1
          fi

          manifest="$(unzip -p "$asset" classes/META-INF/MANIFEST.MF | tr -d '\r')"
          if ! printf '%s\n' "$manifest" | grep -qx "Plugin-Version: ${VERSION}"; then
            echo "::error::插件清单中的版本与 gradle.properties 不一致"
            printf '%s\n' "$manifest"
            exit 1
          fi
          # 校验文件里只写文件名，方便与下载后的资产直接比对。
          (cd build/libs && sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256")

          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "### 构建产物"
            echo ""
            echo "| 资产 | 大小 |"
            echo "| --- | --- |"
            echo "| \`$(basename "$asset")\` | $(du -h "$asset" | cut -f1) |"
            echo ""
            echo "SHA-256：\`$(cut -d' ' -f1 "${asset}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: spmod
          path: |
            build/libs/amll-into-spw-misans-*.spmod
            build/libs/amll-into-spw-misans-*.spmod.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布到 Releases
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v5
        with:
          name: spmod
          path: dist

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          cd dist
          asset="amll-into-spw-misans-${VERSION}.spmod"
          if [ ! -f "$asset" ]; then
            echo "::error::下载的产物缺少 $asset"
            ls -l
            exit 1
          fi

          # 草稿 Release 用 gh release view 可能查不到，直接列出来比对标签名。
          if gh api "repos/${GH_REPO}/releases?per_page=100" --jq '.[].tag_name' | grep -Fxq "$TAG"; then
            echo "Release $TAG 已存在，覆盖上传资产"
            gh release upload "$TAG" "$asset" "${asset}.sha256" --clobber
          else
            args=(--title "AMLL into SPW（MiSans） ${TAG}" --generate-notes --target "$GITHUB_SHA")
            if [ "${DRAFT:-false}" = "true" ]; then
              args+=(--draft)
            fi
            if [ "${PRERELEASE:-false}" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "$asset" "${asset}.sha256" "${args[@]}"
          fi

          {
            echo ""
            echo "### 发布结果"
            echo ""
            echo "https://github.com/${GH_REPO}/releases/tag/${TAG}"
            echo ""
            echo "| 资产 | 大小 |"
            echo "| --- | --- |"
            echo "| \`$asset\` | $(du -h "$asset" | cut -f1) |"
            echo "| \`${asset}.sha256\` | $(du -h "${asset}.sha256" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
